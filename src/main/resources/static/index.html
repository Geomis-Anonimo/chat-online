<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body class="bg-body-tertiary">
<div class="container">
    <form id="form" class="box card shadow-sm p-4">
        <h2 class="h4 mb-3 text-center">Fale com o suporte</h2>
        <input id="name" class="form-control mb-2" placeholder="Nome" maxlength="100" required>
        <input id="email" class="form-control mb-2" type="email" placeholder="E-mail" maxlength="150" required>
        <input id="phone" class="form-control mb-2" type="tel" placeholder="Celular" maxlength="20" required>
        <input id="title" class="form-control mb-3" placeholder="Assunto" maxlength="200" required>
        <button type="submit" class="btn btn-primary w-100">Iniciar atendimento</button>
        <a href="./admin.html" class="link-secondary small text-center mt-3">Sou administrador</a>
    </form>

    <div id="chat" class="box card shadow-sm p-4" hidden>
        <h2 id="chat-title" class="h4 mb-1"></h2>
        <p id="status" class="text-body-secondary small mb-0"></p>
        <div id="messages" class="messages rounded"></div>
        <form id="form-message" class="send">
            <input id="content" class="form-control" placeholder="Digite sua mensagem" maxlength="2000" autocomplete="off">
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <button id="novo" class="btn btn-outline-primary" hidden>Novo atendimento</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/chat.js"></script>
<script src="./js/client.js"></script>
</body>
</html>
