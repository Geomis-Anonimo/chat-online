<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suporte</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
<div class="container">
    <form id="form" class="box">
        <h2>Fale com o suporte</h2>
        <input id="name" placeholder="Nome" maxlength="100" required>
        <input id="email" type="email" placeholder="E-mail" maxlength="150" required>
        <input id="phone" type="tel" placeholder="Celular" maxlength="20" required>
        <input id="title" placeholder="Assunto" maxlength="200" required>
        <button type="submit">Iniciar atendimento</button>
        <a href="./admin.html">Sou administrador</a>
    </form>

    <div id="chat" class="box" hidden>
        <h2 id="chat-title"></h2>
        <p id="status"></p>
        <div id="messages" class="messages"></div>
        <form id="form-message" class="send">
            <input id="content" placeholder="Digite sua mensagem" maxlength="2000" autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
        <button id="novo" hidden>Novo atendimento</button>
    </div>
</div>

<script src="./js/chat.js"></script>
<script src="./js/client.js"></script>
</body>
</html>
