services:
  postgres:
    image: postgres:15
    container_name: chat_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-db}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-db}
      POSTGRES_DB: ${PG_DB:-db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-chat} -d ${PG_DB:-db}"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: chat_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-db}
      PG_USER: ${PG_USER:-db}
      PG_PASSWORD: ${PG_PASSWORD:-db}
      JWT_SECRET: ${JWT_SECRET:-secreta-so-se-der-erro-ao-buscar-a-env}

volumes:
  postgres_data:
