<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suporte - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body class="bg-body-tertiary">
<div class="container">
    <form id="login" class="box card shadow-sm p-4">
        <h2 class="h4 mb-3 text-center">Área do suporte</h2>
        <input id="email" class="form-control mb-2" type="email" placeholder="E-mail" required>
        <input id="password" class="form-control mb-3" type="password" placeholder="Senha" required>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
        <a href="/" class="link-secondary small text-center mt-3">Voltar</a>
    </form>

    <div id="panel" class="panel" hidden>
        <aside class="box card shadow-sm p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <strong id="name-admin"></strong>
                <button id="onLogout" class="btn btn-sm btn-outline-secondary">Sair</button>
            </div>
            <h3 class="h6 text-uppercase text-body-secondary">Atendimentos</h3>
            <ul id="support_conversation" class="mb-0"></ul>
        </aside>

        <section id="chat" class="box card shadow-sm p-4" hidden>
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div>
                    <h2 id="client-name" class="h5 mb-1"></h2>
                    <p id="client-data" class="text-body-secondary small mb-0"></p>
                </div>
                <button id="close" class="btn btn-sm btn-outline-danger">Encerrar atendimento</button>
            </div>
            <div id="messages" class="messages rounded"></div>
            <form id="form-message" class="send">
                <input id="content" class="form-control" placeholder="Digite sua mensagem" maxlength="2000" autocomplete="off">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </section>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./js/chat.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
